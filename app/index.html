<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Mexican Train</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23182a21'/%3E%3Crect x='6' y='9' width='7' height='14' rx='2' fill='%23efe9db'/%3E%3Crect x='16' y='7' width='11' height='5' rx='1.5' fill='%23efe9db'/%3E%3Crect x='16' y='13.5' width='13' height='5' rx='1.5' fill='%23efe9db'/%3E%3Crect x='16' y='20' width='11' height='5' rx='1.5' fill='%23efe9db'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="brand-name">Mexican Train</span>
          <span id="round-chip" class="round-chip"></span>
        </div>
        <div id="status" class="status">
          <div id="status-event" class="status-event"></div>
          <div id="status-prompt" class="status-prompt"></div>
        </div>
        <div class="topbar-right">
          <!-- Значки шапки — собственные рисунки, а не знаки юникода: общий
               viewBox и одна толщина обводки держат ряд ровным на любой системе. -->
          <button id="btn-hist" class="icon-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1" />
              <path d="M3.2 4.4v4.2h4.2" />
              <path d="M12 7.6V12l3 1.8" />
            </svg>
          </button>
          <button id="btn-fit" class="icon-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9V5.5a1 1 0 0 1 1-1h3.5" />
              <path d="M15.5 4.5H19a1 1 0 0 1 1 1V9" />
              <path d="M20 15v3.5a1 1 0 0 1-1 1h-3.5" />
              <path d="M8.5 19.5H5a1 1 0 0 1-1-1V15" />
              <circle cx="12" cy="12" r="2.4" />
            </svg>
          </button>
          <!-- Шестерёнка нужна и на стартовой карточке: значок один, сюда его
               ставит каркас при старте. -->
          <button id="btn-settings" class="icon-btn"></button>
          <button id="btn-new" class="icon-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M13 4H5.5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1H13" />
              <path d="M17 12H10" />
              <path d="M14.5 9 17.5 12l-3 3" />
            </svg>
          </button>
        </div>
      </header>
      <section id="hand-top" class="hand"></section>
      <main id="table">
        <svg id="board"></svg>
        <div id="boneyard"></div>
        <div id="tutor-bar" hidden></div>
        <div id="confirm-bar" hidden></div>
        <div id="history-bar" hidden></div>
        <div id="toast" hidden></div>
      </main>
      <section id="hand-bottom" class="hand"></section>
      <div id="overlay" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
